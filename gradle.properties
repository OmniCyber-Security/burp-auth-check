# Fallback version for local builds. Releases do not use it: the release
# workflow derives the next version from the newest `v*` tag plus the merged
# PR's release label, and passes it in with `-Pversion=<next>`.
version=1.3.0

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx1g

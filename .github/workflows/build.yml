name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Needed to publish releases. Workflow permissions can only narrow what the
# repository allows, so the repository default must also permit writes.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a run that is going to publish something.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Release notes are generated from history.
          fetch-depth: 0

      # The wrapper jar is executable code committed to the repository; check it
      # against the published Gradle checksums before running it.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # `build` runs the tests and produces the shaded extension jar.
      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Locate the extension jar
        id: jar
        run: |
          path=$(ls build/libs/burp-auth-check-*.jar | grep -v sources | head -1)
          if [ -z "$path" ]; then
            echo "No extension jar was produced" >&2
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$path")" >> "$GITHUB_OUTPUT"

      - name: Upload the jar as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: burp-auth-check-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Only useful when something broke, so it is not uploaded otherwise.
      - name: Upload the test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore

      # Every push to main replaces a single rolling prerelease, so the loadable
      # jar is always one click away without accumulating a release per commit.
      - name: Publish the rolling build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          JAR: ${{ steps.jar.outputs.path }}
          JAR_NAME: ${{ steps.jar.outputs.name }}
        run: |
          short="${GITHUB_SHA:0:7}"
          {
            echo "Automatic build of \`main\` at ${short}."
            echo
            echo "Install: Burp -> Extensions -> Installed -> Add -> Extension type **Java** -> \`${JAR_NAME}\`"
            echo
            echo "This prerelease is replaced on every push to \`main\`."
            echo "For a fixed, immutable build, push a \`v*\` tag instead."
          } > release-notes.md

          # Remove the previous rolling release and its tag so the new one points
          # at this commit. Tolerated if it does not exist yet (first run).
          gh release delete latest --yes --cleanup-tag || true

          gh release create latest "$JAR" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build (${short})" \
            --notes-file release-notes.md

      # A `v*` tag produces a permanent, versioned release.
      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          JAR: ${{ steps.jar.outputs.path }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$JAR" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

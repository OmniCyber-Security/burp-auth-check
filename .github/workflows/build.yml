name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release the current main with this bump (manual escape hatch)'
        type: choice
        default: none
        options: [none, patch, minor, major]

# Read-only by default. Only the release job widens this, and only for itself.
# A pull request -- including one from a fork -- can therefore never reach a
# token that is able to tag, release, or write anything to the repository.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a run on main: it is the one that publishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The wrapper jar is executable code committed to the repository, and it
      # runs before anything else in the build. Check it against the checksum
      # Gradle publishes for the exact distribution it claims to be.
      - name: Validate the Gradle wrapper
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');

            const properties = fs.readFileSync('gradle/wrapper/gradle-wrapper.properties', 'utf8');
            const declared = properties.match(/distributionUrl=.*?gradle-([0-9]+(?:\.[0-9]+)+)-(?:bin|all)\.zip/);
            if (!declared) {
              core.setFailed('Could not read a Gradle version out of gradle/wrapper/gradle-wrapper.properties.');
              return;
            }
            const version = declared[1];

            const response = await fetch(
              `https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256`);
            if (!response.ok) {
              core.setFailed(`Gradle publishes no wrapper checksum for ${version} (HTTP ${response.status}).`);
              return;
            }
            const expected = (await response.text()).trim();

            const actual = crypto.createHash('sha256')
              .update(fs.readFileSync('gradle/wrapper/gradle-wrapper.jar'))
              .digest('hex');

            if (actual !== expected) {
              core.setFailed(
                `gradle/wrapper/gradle-wrapper.jar does not match the published Gradle ${version} wrapper.\n`
                + `  expected ${expected}\n  actual   ${actual}`);
              return;
            }
            core.info(`Gradle ${version} wrapper verified (${actual}).`);

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # `build` runs the tests and produces the shaded extension jar.
      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Upload the jar as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: burp-auth-check-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Only useful when something broke, so it is not uploaded otherwise.
      - name: Upload the test report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore

  release:
    name: Tag and release
    needs: build
    # Only ever reachable from a push to main or a deliberate manual run. Pull
    # request events cannot satisfy either, so untrusted code never runs in a
    # job holding a write token.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # A job-level block replaces the workflow default outright rather than adding
    # to it, so everything this job needs has to be listed. `pull-requests: read`
    # is for reading the release label off the merged pull request; `contents:
    # write` is for the tag, the release and its asset.
    permissions:
      contents: write
      pull-requests: read
    steps:
      # The bump comes from the label on the pull request this commit arrived
      # in, which the `release label` check guarantees is present and unique. A
      # commit pushed straight to main has no PR and so releases nothing.
      - name: Decide the version bump
        id: bump
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const LABELS = {
              'release:major': 'major',
              'release:minor': 'minor',
              'release:patch': 'patch',
              'release:none': 'none',
            };

            if (context.eventName === 'workflow_dispatch') {
              const bump = context.payload.inputs.bump;
              core.info(`Manual run requested a ${bump} bump.`);
              core.setOutput('bump', bump);
              return;
            }

            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            const merged = pulls.filter(pull => pull.merged_at !== null);
            if (merged.length === 0) {
              core.notice(
                'This commit did not arrive through a pull request, so there is no release label to read. '
                + 'Nothing will be released. Run this workflow manually if it should be.');
              core.setOutput('bump', 'none');
              return;
            }

            // Newest first, so a commit that somehow belongs to several merged
            // PRs is released as the one that actually landed it.
            merged.sort((a, b) => new Date(b.merged_at) - new Date(a.merged_at));
            const pull = merged[0];

            const applied = [...new Set(pull.labels.map(label => label.name).filter(name => name in LABELS))];
            if (applied.length !== 1) {
              core.setFailed(
                `Pull request #${pull.number} carries ${applied.length} release labels`
                + `${applied.length ? ` (${applied.join(', ')})` : ''}; exactly one is required. `
                + 'Fix the labels and re-run this workflow.');
              return;
            }

            const bump = LABELS[applied[0]];
            core.info(`Pull request #${pull.number} is labelled ${applied[0]} -> ${bump} bump.`);
            core.setOutput('bump', bump);
            core.setOutput('pull', String(pull.number));

      # Semver order, not the API's own ordering, which is not version aware.
      - name: Work out the next version
        id: version
        if: steps.bump.outputs.bump != 'none'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        with:
          script: |
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const released = tags
              .map(tag => /^v(\d+)\.(\d+)\.(\d+)$/.exec(tag.name))
              .filter(Boolean)
              .map(match => match.slice(1, 4).map(Number))
              .sort((a, b) => b[0] - a[0] || b[1] - a[1] || b[2] - a[2]);

            const [major, minor, patch] = released[0] ?? [0, 0, 0];
            const next = {
              major: [major + 1, 0, 0],
              minor: [major, minor + 1, 0],
              patch: [major, minor, patch + 1],
            }[process.env.BUMP];

            if (!next) {
              core.setFailed(`Unknown bump '${process.env.BUMP}'.`);
              return;
            }

            const version = next.join('.');
            if (tags.some(tag => tag.name === `v${version}`)) {
              core.setFailed(`Tag v${version} already exists. Refusing to overwrite a published release.`);
              return;
            }

            core.info(`${released[0] ? released[0].join('.') : 'no previous release'} -> ${version}`);
            core.setOutput('version', version);
            core.setOutput('tag', `v${version}`);

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.bump.outputs.bump != 'none'

      - name: Set up JDK
        if: steps.bump.outputs.bump != 'none'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Rebuilt rather than reusing the CI artifact: the version being released
      # has to be stamped into the jar manifest, and it is not known until the
      # label has been read. The tests run again with it for the same reason.
      - name: Build the release jar
        if: steps.bump.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon -Pversion="$VERSION" build

      - name: Tag, release and attach the jar
        if: steps.bump.outputs.bump != 'none'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { VERSION, TAG } = process.env;
            const { owner, repo } = context.repo;

            const jarName = `burp-auth-check-${VERSION}.jar`;
            const jar = path.join('build', 'libs', jarName);
            if (!fs.existsSync(jar)) {
              core.setFailed(`The build did not produce ${jar}.`);
              return;
            }

            // Tag first: if the release call fails, the tag is a harmless
            // no-op to retry, whereas a release with no tag is not.
            await github.rest.git.createRef({
              owner, repo, ref: `refs/tags/${TAG}`, sha: context.sha,
            });

            const { data: release } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: TAG,
              name: TAG,
              target_commitish: context.sha,
              generate_release_notes: true,
              body: [
                `Install: Burp -> Extensions -> Installed -> Add -> Extension type **Java** -> \`${jarName}\``,
                '',
              ].join('\n'),
            });

            await github.rest.repos.uploadReleaseAsset({
              owner, repo,
              release_id: release.id,
              name: jarName,
              headers: {
                'content-type': 'application/java-archive',
                'content-length': fs.statSync(jar).size,
              },
              data: fs.readFileSync(jar),
            });

            await core.summary
              .addHeading(`Released ${TAG}`, 3)
              .addLink(release.html_url, release.html_url)
              .write();
            core.notice(`Released ${TAG}: ${release.html_url}`);

      - name: Report that nothing was released
        if: steps.bump.outputs.bump == 'none'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await core.summary
              .addHeading('No release', 3)
              .addRaw('This change is labelled `release:none`, so the version is unchanged and no tag was created.')
              .write();
            core.info('release:none -- nothing to do.');
